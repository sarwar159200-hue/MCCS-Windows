name: Build MCCS Windows V1

on:
  workflow_dispatch:

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
          - name: x86
            target: i686-pc-windows-msvc

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Find MCCS Windows application
        id: findapp
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Filter package.json |
            Where-Object {
              Test-Path (Join-Path $_.Directory.FullName "src-tauri\Cargo.toml")
            } |
            Select-Object -First 1

          if (-not $package) {
            throw "Could not find the MCCS Windows application."
          }

          $appPath = $package.Directory.FullName
          Write-Host "MCCS application found at: $appPath"
          "app_path=$appPath" >> $env:GITHUB_OUTPUT

      - name: Verify MCCS files and no-console fix
        shell: pwsh
        run: |
          $app = "${{ steps.findapp.outputs.app_path }}"
          $required = @(
            (Join-Path $app "package.json"),
            (Join-Path $app "src-tauri\Cargo.toml"),
            (Join-Path $app "src-tauri\tauri.conf.json"),
            (Join-Path $app "src-tauri\src\main.rs"),
            (Join-Path $app "src-tauri\icons\icon.ico")
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required file missing: $file" }
          }
          $main = Get-Content (Join-Path $app "src-tauri\src\main.rs") -Raw
          if ($main -notmatch 'windows_subsystem\s*=\s*"windows"') {
            throw "Windows GUI subsystem fix is missing from main.rs"
          }
          Write-Host "MCCS project, Miran icon and no-console fix verified."

      - name: Install Node dependencies
        shell: pwsh
        run: |
          Set-Location "${{ steps.findapp.outputs.app_path }}"
          npm install

      - name: Build MCCS Windows installer
        shell: pwsh
        run: |
          Set-Location "${{ steps.findapp.outputs.app_path }}"
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Find and rename installer
        id: installer
        shell: pwsh
        run: |
          $app = "${{ steps.findapp.outputs.app_path }}"
          $bundle = Join-Path $app "src-tauri\target\${{ matrix.target }}\release\bundle\nsis"
          if (-not (Test-Path $bundle)) { throw "NSIS bundle folder was not created: $bundle" }
          $setup = Get-ChildItem -Path $bundle -Recurse -File -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Windows Setup EXE was not found in $bundle" }
          $output = Join-Path $env:RUNNER_TEMP "MCCS-Windows-V1.3-${{ matrix.name }}-Setup.exe"
          Copy-Item $setup.FullName $output -Force
          Write-Host "Installer ready: $output"
          "installer_path=$output" >> $env:GITHUB_OUTPUT

      - name: Upload MCCS installer
        uses: actions/upload-artifact@v4
        with:
          name: MCCS-Windows-V1.3-${{ matrix.name }}
          path: ${{ steps.installer.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
