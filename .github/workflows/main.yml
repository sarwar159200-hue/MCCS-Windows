name: Build MCCS Windows V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
          - name: x86
            target: i686-pc-windows-msvc

    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Go to MCCS Windows folder
        shell: pwsh
        run: |
          cd MCCS-Windows-V1-Build-Package/MCCS-Windows-V1
          npm install

      - name: Build MCCS Windows installer
        shell: pwsh
        run: |
          cd MCCS-Windows-V1-Build-Package/MCCS-Windows-V1
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Prepare installer
        shell: pwsh
        run: |
          cd MCCS-Windows-V1-Build-Package/MCCS-Windows-V1

          New-Item -ItemType Directory -Force -Path output

          $installer = Get-ChildItem `
            -Path "src-tauri\target\${{ matrix.target }}\release\bundle\nsis" `
            -Filter "*-setup.exe" `
            -Recurse |
            Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE was not found."
          }

          Copy-Item `
            $installer.FullName `
            "output\MCCS-Windows-V1-${{ matrix.name }}-Setup.exe"

      - name: Upload MCCS Installer
        uses: actions/upload-artifact@v4
        with:
          name: MCCS-Windows-V1-${{ matrix.name }}
          path: MCCS-Windows-V1-Build-Package/MCCS-Windows-V1/output/MCCS-Windows-V1-${{ matrix.name }}-Setup.exe
          if-no-files-found: error
